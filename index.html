<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>XLM SPIDER | Stellar Digital Asset</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =====================================================
   CORE
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#030303;
    color:#fff;
    font-family:'Rajdhani',sans-serif;
    overflow-x:hidden;
}

/* ENGINEERING GRID */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:100;

    background:
    linear-gradient(rgba(255,0,35,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,0,35,.025) 1px,transparent 1px);

    background-size:45px 45px;
}

/* SCANLINES */

body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:101;

    background:
    repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 3px,
        rgba(255,255,255,.018) 4px
    );
}

/* =====================================================
   NAV
===================================================== */

nav{
    height:76px;
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 6%;

    background:rgba(0,0,0,.82);
    border-bottom:1px solid rgba(255,0,35,.3);

    backdrop-filter:blur(18px);
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;

    font-family:'Orbitron';
    font-weight:900;
    letter-spacing:3px;
}

.brand-mark{
    width:35px;
    height:35px;
    position:relative;
}

/* MINI DIGITAL SPIDER LOGO */

.brand-mark .head{
    position:absolute;
    width:14px;
    height:14px;
    left:11px;
    top:4px;
    border-radius:50%;
    background:#050505;
    border:2px solid #ff173d;
    box-shadow:0 0 12px #ff173d;
}

.brand-mark .body{
    position:absolute;
    width:15px;
    height:17px;
    left:10px;
    top:17px;
    border-radius:45%;
    background:#080808;
    border:2px solid #ff173d;
}

.brand-mark i{
    position:absolute;
    width:17px;
    height:2px;
    background:#ff173d;
    box-shadow:0 0 5px #ff173d;
    transform-origin:left;
}

.brand-mark .a{left:11px;top:19px;transform:rotate(155deg)}
.brand-mark .b{left:11px;top:24px;transform:rotate(175deg)}
.brand-mark .c{left:11px;top:29px;transform:rotate(200deg)}
.brand-mark .d{left:24px;top:19px;transform:rotate(25deg)}
.brand-mark .e{left:24px;top:24px;transform:rotate(5deg)}
.brand-mark .f{left:24px;top:29px;transform:rotate(-20deg)}

.brand span{
    color:#ff173d;
}

.network{
    font-family:'Orbitron';
    font-size:10px;
    letter-spacing:3px;
    color:#666;
}

.network b{
    color:#ff173d;
}

/* =====================================================
   HERO
===================================================== */

.hero{
    min-height:100vh;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:120px 20px 70px;

    background:
    radial-gradient(
        circle at 50% 45%,
        rgba(255,0,40,.14),
        transparent 32%
    ),
    radial-gradient(
        circle at 20% 80%,
        rgba(255,0,30,.05),
        transparent 30%
    ),
    #030303;
}

/* GIANT TECH CIRCLE */

.hero::before{
    content:"";
    position:absolute;

    width:700px;
    height:700px;

    border-radius:50%;

    border:1px solid rgba(255,0,40,.2);

    box-shadow:
        0 0 80px rgba(255,0,40,.08),
        inset 0 0 80px rgba(255,0,40,.04);
}

/* TECH RINGS */

.ring{
    position:absolute;
    width:520px;
    height:520px;
    border:1px dashed rgba(255,0,40,.22);
    border-radius:50%;
    animation:rotate 25s linear infinite;
}

.ring2{
    width:620px;
    height:620px;
    border:1px solid rgba(255,255,255,.06);
    animation:rotateReverse 35s linear infinite;
}

@keyframes rotate{
    to{transform:rotate(360deg)}
}

@keyframes rotateReverse{
    to{transform:rotate(-360deg)}
}

/* =====================================================
   DIGITAL SPIDER LOGO
===================================================== */

.hero-spider{
    position:absolute;
    width:330px;
    height:330px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    opacity:.17;
    filter:drop-shadow(0 0 25px #ff0038);
}

/* HEAD */

.hero-spider .head{
    position:absolute;
    width:100px;
    height:88px;

    left:115px;
    top:25px;

    border-radius:50% 50% 45% 45%;

    background:
    linear-gradient(145deg,#171717,#020202);

    border:4px solid #ff173d;

    box-shadow:
    0 0 25px #ff173d,
    inset 0 0 20px rgba(255,0,40,.3);
}

/* EYES */

.eye{
    position:absolute;
    width:27px;
    height:40px;

    top:23px;

    background:#eee;

    border:2px solid #ff173d;

    box-shadow:
    0 0 15px #fff;
}

.eye1{
    left:17px;
    transform:skew(-12deg) rotate(18deg);
}

.eye2{
    right:17px;
    transform:skew(12deg) rotate(-18deg);
}

/* BODY */

.hero-spider .body{
    position:absolute;

    width:125px;
    height:145px;

    left:102px;
    top:105px;

    border-radius:48%;

    background:
    radial-gradient(circle,#151515,#020202);

    border:4px solid #ff173d;

    box-shadow:
    0 0 30px rgba(255,0,40,.6);
}

/* XLM MARK */

.xlm-mark{
    position:absolute;
    left:50%;
    top:48%;

    transform:translate(-50%,-50%);

    font-family:'Orbitron';
    font-size:32px;
    font-weight:900;

    color:#fff;

    text-shadow:
    0 0 8px #fff,
    0 0 20px #ff173d,
    0 0 35px #ff173d;
}

.xlm-mark::after{
    content:"DIGITAL ASSET";
    position:absolute;
    left:50%;
    top:45px;
    transform:translateX(-50%);

    white-space:nowrap;

    font-size:6px;
    letter-spacing:3px;
    color:#ff173d;
}

/* SPIDER LEGS */

.hero-spider i{
    position:absolute;

    width:125px;
    height:4px;

    background:#ff173d;

    box-shadow:
    0 0 8px #ff173d,
    0 0 20px rgba(255,0,40,.6);

    transform-origin:left center;
}

.l1{left:110px;top:130px;transform:rotate(155deg)}
.l2{left:108px;top:160px;transform:rotate(175deg)}
.l3{left:110px;top:190px;transform:rotate(200deg)}

.r1{left:220px;top:130px;transform:rotate(25deg)}
.r2{left:222px;top:160px;transform:rotate(5deg)}
.r3{left:220px;top:190px;transform:rotate(-20deg)}

/* =====================================================
   HERO CONTENT
===================================================== */

.hero-content{
    position:relative;
    z-index:20;

    text-align:center;

    max-width:900px;
}

.system{
    font-family:'Orbitron';
    font-size:10px;
    letter-spacing:6px;

    color:#ff173d;

    margin-bottom:25px;
}

h1{
    font-family:'Orbitron';

    font-size:clamp(50px,10vw,105px);

    font-weight:900;

    line-height:.9;

    letter-spacing:-5px;

    text-transform:uppercase;

    text-shadow:
    0 0 20px rgba(255,0,40,.15);
}

h1 span{
    color:#ff173d;

    text-shadow:
    0 0 15px #ff173d,
    0 0 45px rgba(255,0,40,.35);
}

.subtitle{
    max-width:680px;

    margin:35px auto;

    color:#9b9b9b;

    font-size:19px;

    line-height:1.6;
}

.hero-line{
    width:150px;
    height:2px;

    margin:25px auto;

    background:#ff173d;

    box-shadow:0 0 15px #ff173d;
}

/* =====================================================
   BUTTONS
===================================================== */

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.button{
    position:relative;

    min-width:190px;

    padding:17px 25px;

    text-decoration:none;

    color:#fff;

    font-family:'Orbitron';

    font-size:10px;

    letter-spacing:2px;

    border:1px solid rgba(255,255,255,.18);

    background:#080808;

    transition:.3s;

    overflow:hidden;
}

.button:hover{
    transform:translateY(-5px);

    border-color:#ff173d;

    box-shadow:
    0 0 30px rgba(255,0,40,.3);
}

.button.red{
    background:#c9002d;
    border-color:#ff173d;
}

.button::after{
    content:"";

    position:absolute;

    width:100%;
    height:1px;

    bottom:0;
    left:-100%;

    background:#fff;

    transition:.4s;
}

.button:hover::after{
    left:100%;
}

/* =====================================================
   SECTIONS
===================================================== */

section{
    padding:120px 7%;

    position:relative;
}

.section-code{
    font-family:'Orbitron';

    font-size:9px;

    letter-spacing:5px;

    color:#ff173d;

    text-align:center;

    margin-bottom:15px;
}

.title{
    text-align:center;

    font-family:'Orbitron';

    font-size:clamp(28px,5vw,55px);

    font-weight:800;

    margin-bottom:20px;
}

.title span{
    color:#ff173d;
}

.description{
    max-width:700px;

    margin:0 auto 60px;

    text-align:center;

    color:#777;

    font-size:18px;

    line-height:1.7;
}

/* =====================================================
   ENGINEERING CARDS
===================================================== */

.cards{
    max-width:1200px;

    margin:auto;

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:20px;
}

.card{
    position:relative;

    min-height:300px;

    padding:30px;

    overflow:hidden;

    border:1px solid rgba(255,255,255,.1);

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.055),
        rgba(255,255,255,.008)
    );

    transition:.35s;
}

.card:hover{
    transform:translateY(-8px);

    border-color:#ff173d;

    box-shadow:
    0 20px 50px rgba(0,0,0,.7),
    0 0 25px rgba(255,0,40,.12);
}

.card-code{
    font-family:'Orbitron';

    font-size:10px;

    color:#ff173d;

    letter-spacing:3px;
}

.card h3{
    font-family:'Orbitron';

    margin-top:65px;

    font-size:20px;
}

.card p{
    margin-top:15px;

    color:#777;

    line-height:1.6;
}

/* =====================================================
   TOKEN PANEL
===================================================== */

.token-panel{
    max-width:1050px;

    margin:auto;

    padding:45px;

    border:1px solid rgba(255,0,40,.3);

    background:#060606;

    box-shadow:
    0 0 70px rgba(255,0,40,.06);
}

.token-grid{
    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:15px;
}

.token{
    padding:23px;

    background:#0a0a0a;

    border-left:2px solid #ff173d;
}

.token small{
    display:block;

    font-family:'Orbitron';

    color:#555;

    font-size:9px;

    letter-spacing:2px;

    margin-bottom:9px;
}

.token strong{
    font-size:17px;

    word-break:break-all;
}

/* =====================================================
   THREE ACCESS PORTALS
===================================================== */

.portals{
    max-width:1200px;

    margin:auto;

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:22px;
}

.portal{
    min-height:410px;

    position:relative;

    display:flex;

    flex-direction:column;

    justify-content:flex-end;

    padding:32px;

    text-decoration:none;

    color:#fff;

    overflow:hidden;

    border:1px solid rgba(255,255,255,.15);

    transition:.4s;
}

/* RED */

.portal.red{
    background:
    radial-gradient(
        circle at 50% 20%,
        rgba(255,0,40,.38),
        transparent 38%
    ),
    linear-gradient(145deg,#280006,#050505);
}

/* GOLD */

.portal.gold{
    background:
    radial-gradient(
        circle at 50% 20%,
        rgba(255,180,0,.3),
        transparent 38%
    ),
    linear-gradient(145deg,#241800,#050505);
}

/* BLACK */

.portal.black{
    background:
    radial-gradient(
        circle at 50% 20%,
        rgba(255,255,255,.12),
        transparent 38%
    ),
    linear-gradient(145deg,#171717,#000);
}

.portal:hover{
    transform:translateY(-12px);

    box-shadow:
    0 30px 70px rgba(0,0,0,.8);
}

/* PORTAL SPIDER */

.portal-spider{
    position:absolute;

    width:170px;
    height:170px;

    left:50%;
    top:45px;

    transform:translateX(-50%);

    transition:.5s;
}

.portal:hover .portal-spider{
    transform:
    translateX(-50%)
    translateY(-10px)
    rotate(-4deg);
}

.phead{
    position:absolute;

    width:50px;
    height:45px;

    left:60px;
    top:5px;

    border-radius:50%;

    background:#030303;

    border:2px solid currentColor;
}

.pbody{
    position:absolute;

    width:65px;
    height:75px;

    left:52px;
    top:48px;

    border-radius:48%;

    background:#050505;

    border:2px solid currentColor;
}

.pleg{
    position:absolute;

    width:70px;
    height:3px;

    background:currentColor;

    transform-origin:left;
}

.pl1{left:58px;top:63px;transform:rotate(150deg)}
.pl2{left:58px;top:80px;transform:rotate(170deg)}
.pl3{left:58px;top:96px;transform:rotate(195deg)}

.pr1{left:112px;top:63px;transform:rotate(30deg)}
.pr2{left:112px;top:80px;transform:rotate(10deg)}
.pr3{left:112px;top:96px;transform:rotate(-15deg)}

.portal.red .portal-spider{
    color:#ff173d;
    filter:drop-shadow(0 0 12px #ff173d);
}

.portal.gold .portal-spider{
    color:#ffc400;
    filter:drop-shadow(0 0 12px #ffc400);
}

.portal.black .portal-spider{
    color:#fff;
    filter:drop-shadow(0 0 12px #fff);
}

.portal h3{
    font-family:'Orbitron';

    font-size:20px;

    margin-bottom:10px;
}

.portal p{
    color:#777;

    line-height:1.5;

    margin-bottom:20px;
}

.portal-arrow{
    font-family:'Orbitron';

    font-size:11px;

    letter-spacing:3px;
}

/* =====================================================
   3D COLLECTION WINDOW
===================================================== */

.animation-section{
    background:
    radial-gradient(
        circle at center,
        rgba(255,0,40,.08),
        transparent 45%
    );
}

.animation-window{
    max-width:1100px;

    height:520px;

    margin:auto;

    position:relative;

    overflow:hidden;

    border:1px solid rgba(255,0,40,.35);

    background:
    linear-gradient(
        180deg,
        #0b0b0b,
        #020202
    );

    box-shadow:
    0 0 80px rgba(255,0,40,.08);
}

/* WINDOW HEADER */

.window-header{
    position:absolute;

    top:0;
    left:0;
    right:0;

    height:50px;

    display:flex;
    align-items:center;

    justify-content:space-between;

    padding:0 20px;

    border-bottom:1px solid rgba(255,255,255,.08);

    background:#080808;

    z-index:20;
}

.window-header span{
    font-family:'Orbitron';

    font-size:9px;

    letter-spacing:3px;

    color:#777;
}

.live{
    color:#ff173d !important;
}

/* FLOOR */

.floor{
    position:absolute;

    left:-20%;

    bottom:-190px;

    width:140%;

    height:450px;

    transform:
    perspective(500px)
    rotateX(65deg);

    background:
    linear-gradient(rgba(255,0,40,.15) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,0,40,.15) 1px,transparent 1px);

    background-size:50px 50px;
}

/* WEB */

.big-web{
    position:absolute;

    width:500px;
    height:500px;

    left:50%;
    top:40px;

    transform:translateX(-50%);

    border-radius:50%;

    border:1px solid rgba(255,255,255,.15);

    box-shadow:
    0 0 40px rgba(255,0,40,.08);
}

.big-web::before,
.big-web::after{
    content:"";

    position:absolute;

    inset:60px;

    border-radius:50%;

    border:1px solid rgba(255,0,40,.18);
}

.big-web::after{
    inset:130px;

    border-color:rgba(255,255,255,.12);
}

/* WEB LINES */

.web-line{
    position:absolute;

    left:50%;
    top:50%;

    width:500px;

    height:1px;

    background:rgba(255,0,40,.2);

    transform-origin:center;
}

.w1{transform:rotate(0deg)}
.w2{transform:rotate(45deg)}
.w3{transform:rotate(90deg)}
.w4{transform:rotate(135deg)}

/* COLLECTOR SPIDER */

.collector{
    position:absolute;

    left:50%;
    top:100px;

    width:170px;
    height:190px;

    transform:
    translateX(-50%);

    z-index:10;

    animation:
    collectorMove 7s ease-in-out infinite;
}

@keyframes collectorMove{

    0%,100%{
        transform:translateX(-50%) translateY(0);
    }

    45%{
        transform:translateX(-50%) translateY(70px);
    }

    70%{
        transform:translateX(-50%) translateY(20px);
    }
}

.collector-head{
    position:absolute;

    width:55px;
    height:50px;

    left:58px;
    top:20px;

    border-radius:50%;

    background:#080808;

    border:3px solid #ff173d;

    box-shadow:
    0 0 20px rgba(255,0,40,.7);
}

.collector-body{
    position:absolute;

    width:70px;
    height:85px;

    left:50px;
    top:65px;

    border-radius:48%;

    background:#050505;

    border:3px solid #ff173d;

    box-shadow:
    0 0 25px rgba(255,0,40,.45);
}

.collector-eye{
    position:absolute;

    width:13px;
    height:19px;

    background:#fff;

    top:13px;

    box-shadow:0 0 12px #fff;
}

.ce1{left:10px;transform:rotate(15deg)}
.ce2{right:10px;transform:rotate(-15deg)}

.collector-leg{
    position:absolute;

    width:85px;
    height:3px;

    background:#ff173d;

    box-shadow:0 0 8px #ff173d;

    transform-origin:left;
}

.cl1{left:58px;top:80px;transform:rotate(150deg)}
.cl2{left:58px;top:100px;transform:rotate(170deg)}
.cl3{left:58px;top:120px;transform:rotate(195deg)}

.cr1{left:108px;top:80px;transform:rotate(30deg)}
.cr2{left:108px;top:100px;transform:rotate(10deg)}
.cr3{left:108px;top:120px;transform:rotate(-15deg)}

/* XLM COLLECTION */

.coin{
    position:absolute;

    width:42px;
    height:42px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-family:'Orbitron';

    font-size:8px;

    font-weight:900;

    color:#fff;

    border:2px solid #ff173d;

    background:#0a0a0a;

    box-shadow:
    0 0 18px rgba(255,0,40,.7);

    animation:
    coinFloat 3s ease-in-out infinite;
}

.coin:nth-child(1){
    left:22%;
    top:48%;
}

.coin:nth-child(2){
    left:68%;
    top:55%;
    animation-delay:.7s;
}

.coin:nth-child(3){
    left:35%;
    top:65%;
    animation-delay:1.2s;
}

.coin:nth-child(4){
    left:76%;
    top:35%;
    animation-delay:1.8s;
}

.coin:nth-child(5){
    left:15%;
    top:30%;
    animation-delay:2.2s;
}

@keyframes coinFloat{

    0%,100%{
        transform:translateY(0) rotate(0);
    }

    50%{
        transform:translateY(-14px) rotate(180deg);
    }
}

/* =====================================================
   FOOTER
===================================================== */

footer{
    padding:70px 20px;

    text-align:center;

    border-top:1px solid rgba(255,255,255,.08);

    background:#020202;
}

.footer-brand{
    font-family:'Orbitron';

    font-size:26px;

    font-weight:900;

    letter-spacing:3px;
}

.footer-brand span{
    color:#ff173d;
}

footer p{
    margin-top:12px;

    color:#555;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:850px){

    .network{
        display:none;
    }

    .cards,
    .portals{
        grid-template-columns:1fr;
    }

    .token-grid{
        grid-template-columns:1fr;
    }

    .hero::before{
        width:450px;
        height:450px;
    }

    .ring2{
        width:430px;
        height:430px;
    }

    .animation-window{
        height:430px;
    }

    .big-web{
        width:380px;
        height:380px;
    }

    .web-line{
        width:380px;
    }
}

@media(max-width:500px){

    nav{
        padding:0 18px;
    }

    .brand{
        font-size:13px;
    }

    section{
        padding:90px 18px;
    }

    .hero-spider{
        transform:
        translate(-50%,-50%)
        scale(.72);
    }

    .hero-content{
        padding-top:30px;
    }

    .subtitle{
        font-size:16px;
    }

    .buttons{
        flex-direction:column;
    }
